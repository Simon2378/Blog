<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>
  <title>Homeguest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
  <link rel="stylesheet" href="Blog1.css">
</head>
<body>
  <!-- HTML code for file "html" -->
  <header>
    <nav>
      <div class="logo">OurApp</div>
      <form class="signin-form" aria-label="Sign in form">
        <input type="text" placeholder="Username" class="input-small" />
        <input type="password" placeholder="Password" class="input-small" />
        <button type="submit" class="btn-signin">Sign In</button>
      </form>
    </nav>
  </header>

  <main>
    <section class="left-section">
      <h1>Remember Writing?</h1>
      <p>
        Are you sick of short tweets and impersonal “shared” posts that are reminiscent of the late 90’s email forwards? We believe getting back to actually writing is the key to enjoying the internet again.
      </p>
    </section>

    <section class="right-section">
      <form class="signup-form" aria-label="Sign up form">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Pick a username" class="input" />

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" class="input" />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Create a password" class="input" />

        <label for="confirm-password">Confirm Password</label>
        <input id="confirm-password" type="password" placeholder="Confirm password" class="input" />

        <button type="submit" class="btn-signup">Sign up for OurApp</button>
      </form>
    </section>
  </main>

  <footer>
    Copyright © 2013 OurApp. All rights reserved.
  </footer>
</body>
</html>
